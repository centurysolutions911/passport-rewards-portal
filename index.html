<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Passport Rewards portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#8F84FF}a:hover{color:#F2F3F7}
</style>
</head>
<body>
<div style="min-height:100vh;background:#07080D;background-image:radial-gradient(800px 500px at 50% -10%,rgba(143,132,255,.25),transparent 60%);font-family:Geist,system-ui,sans-serif;color:#F2F3F7;display:flex;align-items:center;justify-content:center;padding:32px 16px;box-sizing:border-box">
<main style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px;background:#11131E;border:1px solid rgba(242,243,247,0.12);border-radius:20px;padding:32px;box-shadow:0 2px 4px rgba(5,5,11,.24),0 8px 18px -4px rgba(5,5,11,.3),0 0 80px -20px rgba(143,132,255,.45)">
<span style="display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="width:28px;height:28px;border-radius:50%;border:1.5px solid #F2F3F7;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;border-radius:50%;background:#3DD9F0"></span></span><span style="font-size:14px;font-weight:600;letter-spacing:.18em">CENTURY</span></span>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8F84FF">Client portal</span><h1 style="margin:0;font-size:30px;font-weight:500;letter-spacing:-.03em">Sign in to your workspace</h1><p style="margin:0;font-size:15px;color:#B7BCCC">We’ll email you a secure sign-in link. No password to remember.</p></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#B7BCCC">Work email<input id="email" type="email" autocomplete="email" placeholder="you@company.com" style="font:inherit;font-size:15px;color:#F2F3F7;background:#171A28;border:1px solid rgba(242,243,247,0.12);border-radius:999px;padding:12px 16px"></label>
<a id="magic" href="overview.html" style="text-align:center;font-size:15px;font-weight:500;padding:12px 18px;border-radius:999px;background:#F2F3F7;color:#07080D;text-decoration:none">Email me a sign-in link</a>
<div style="display:flex;align-items:center;gap:10px;color:#B7BCCC;font-size:13px"><span style="flex:1;height:1px;background:rgba(242,243,247,0.12)"></span>or<span style="flex:1;height:1px;background:rgba(242,243,247,0.12)"></span></div>
<a href="overview.html" style="text-align:center;font-size:15px;font-weight:500;padding:12px 18px;border-radius:999px;border:1px solid rgba(242,243,247,0.22);color:#F2F3F7;text-decoration:none">Continue with Google</a>
<p style="margin:0;font-size:13px;color:#B7BCCC">Trouble signing in? <a href="https://centurysolutions.com.au">Contact Jen</a></p>
</main>
</div>

<script type="text/plain" id="logic">
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script><script>
(function(){
class DCLogic{constructor(){this.state=null}setState(o){this.state=Object.assign({},this.state||{},o);apply()}}
var C=null;try{C=(new Function('DCLogic',document.getElementById('logic').textContent+';return Component;'))(DCLogic)}catch(e){}
var comp=C?new C():null;
function apply(){if(!comp)return;var v=comp.renderVals();
document.querySelectorAll('[data-if]').forEach(function(e){e.style.display=v[e.dataset.if]?'contents':'none'});
document.querySelectorAll('[data-text]').forEach(function(e){e.textContent=v[e.dataset.text]});
document.querySelectorAll('[data-sty]').forEach(function(e){e.setAttribute('style',e.dataset.base+v[e.dataset.sty])});}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-click]');if(t&&comp){var f=comp.renderVals()[t.dataset.click];if(f)f()}});
apply();})();
</script>
<script>
(function(){
var a=document.getElementById('magic'),inp=document.getElementById('email');
a.addEventListener('click',function(e){e.preventDefault();
 var v=(inp.value||'').trim();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){inp.style.borderColor='#FF8A9A';inp.focus();inp.setAttribute('aria-invalid','true');return;}
 var m=document.querySelector('main'),logo=m.firstElementChild;
 var esc=v.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});
 m.innerHTML='';m.appendChild(logo);
 var d=document.createElement('div');d.setAttribute('role','status');d.style.cssText='display:flex;flex-direction:column;gap:14px';
 d.innerHTML='<span style="font-family:\'Geist Mono\',ui-monospace,monospace;font-size:12px;letter-spacing:.2em;color:#8F84FF">CHECK YOUR INBOX</span>'+
 '<h1 style="margin:0;font-size:32px;font-weight:500;letter-spacing:-.03em;color:#F2F3F7">We\u2019ve sent you a link</h1>'+
 '<p style="margin:0;font-size:15px;line-height:1.5;color:#B7BCCC">A secure sign-in link is on its way to <span style="color:#F2F3F7">'+esc+'</span>. It works once and expires in 15 minutes.</p>'+
 '<a href="overview.html" style="text-align:center;font-size:15px;font-weight:500;padding:12px 18px;border-radius:999px;background:#F2F3F7;color:#07080D;text-decoration:none">Open the sign-in link (demo)</a>'+
 '<a href="index.html" style="text-align:center;font-size:14px;color:#B7BCCC">Use a different email</a>';
 m.appendChild(d);});
inp.addEventListener('input',function(){inp.style.borderColor='';inp.removeAttribute('aria-invalid')});
})();
</script>
</body></html>
